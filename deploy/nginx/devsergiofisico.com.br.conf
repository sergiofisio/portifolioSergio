# /etc/nginx/sites-available/devsergiofisico.com.br
# O nginx termina o HTTPS e repassa tudo para o container do portfólio (127.0.0.1:3020).

upstream portfolio_next {
    server 127.0.0.1:3020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name devsergiofisico.com.br www.devsergiofisico.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://devsergiofisico.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.devsergiofisico.com.br;

    ssl_certificate /etc/letsencrypt/live/devsergiofisico.com.br-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devsergiofisico.com.br-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://devsergiofisico.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name devsergiofisico.com.br;

    ssl_certificate /etc/letsencrypt/live/devsergiofisico.com.br-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devsergiofisico.com.br-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://portfolio_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
